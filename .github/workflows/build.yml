name: Build and Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore Json2md.slnx

    - name: Build
      run: dotnet build Json2md.slnx --configuration Release --no-restore

    - name: Test
      run: dotnet run --project tests/Json2md.Tests/Json2md.Tests.csproj --configuration Release --no-build

    - name: Pack NuGet package
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      run: dotnet pack src/Json2md/Json2md.csproj --configuration Release --no-build --output ./nupkg

    - name: Upload NuGet artifact
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./nupkg/*.nupkg
        retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download NuGet artifact
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: ./nupkg

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish to NuGet
      run: |
        dotnet nuget push "./nupkg/*.nupkg" \
          --source "${{ env.NUGET_SOURCE }}" \
          --api-key "${{ secrets.NUGET_API_KEY }}" \
          --skip-duplicate
